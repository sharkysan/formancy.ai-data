packages:
  - "packages/*"
  # Applications: private, never published, and built by turbo like the rest.
  # apps/examples renders generated forms under both upstream renderers;
  # apps/studio is the administrator's application over the server's
  # administrator plane; apps/host is a host application's workspace over its
  # runtime plane: the forms a person may read, their records and their rows.
  - "apps/*"

# Shared dependency versions live here so the packages cannot drift apart.
allowBuilds:
  esbuild: true
  # Transitive through testcontainers. Optional SSH acceleration used by its
  # Docker client; the JavaScript fallbacks suffice, as they do upstream.
  cpu-features: false
  ssh2: false
  # Only checks dependency version notation; no generated runtime artefacts.
  protobufjs: false
  # Transitive through @angular/build, which the examples' Angular plugin
  # compiles with. Each install script only builds a native addon from source
  # when no prebuilt one fits; the prebuilt ones arrive as optional packages,
  # and the examples build and test without the scripts running.
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

catalog:
  # The TypeScript line formancy.ai compiles under: its Angular 22 declares
  # `typescript: ">=6.0 <6.1"`. The declarations this repository consumes from
  # @formancy/* were emitted by 6.0.x, and the Angular example coming here will
  # need the same line, so there is one version across both repositories.
  typescript: ~6.0.3

  vitest: ^5.0.1
  "@vitest/coverage-v8": ^5.0.1

  # The accessibility floor, at formancy.ai's catalog version: its rule ids are
  # what @formancy/conformance's exclusions name, so the previews here are
  # audited against the same rules the renderers are held to upstream.
  axe-core: ^4.13.0

  # The browser gates for what jsdom cannot see: layout, focus and colour,
  # measured in Chromium, Firefox and WebKit (0058). formancy.ai's catalog
  # version, so one browser revision serves both repositories on one machine.
  playwright: ^1.63.0

  tsdown: ^0.23.0
  publint: ^0.3.24
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^22.10.0

  # The repository's guards and the release report read YAML: the workflows,
  # compose.yaml's services and CI's setup-node versions (0035). Already in
  # the lockfile through vite.
  yaml: ^2.9.1

  # Database behaviour is proved against real servers, never mocks (0003).
  # One version for the family, so the two adapters start containers the same way.
  testcontainers: ^12.1.0
  "@testcontainers/postgresql": ^12.1.0
  "@testcontainers/mssqlserver": ^12.1.0

# pnpm refuses a package published less than a day ago, the lockfile's
# included, and an upstream release is adopted the day it is published (0055).
# So each package of that release is exempt here, by its exact version, as
# pnpm writes it when the pins move -- `@formancy/expressions` too, which comes
# in beneath the others. Nothing outside upstream is exempt, and an exemption
# for a version the lockfile no longer installs is removed:
# scripts/upstream-deps.mjs refuses either.
minimumReleaseAgeExclude:
  - '@formancy/angular@0.5.0'
  - '@formancy/builder-core@0.5.0'
  - '@formancy/conformance@0.5.0'
  - '@formancy/core@0.5.0'
  - '@formancy/expressions@0.5.0'
  - '@formancy/react@0.5.0'
  - '@formancy/spec@0.5.0'
  - '@formancy/themes@0.5.0'
