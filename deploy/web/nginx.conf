# The composed stack's one origin (0032): the studio at /studio/, the host
# page at /host/, and the data server's /v1/ and /health behind them, so every
# request either page makes is same-origin, as 0024 and 0029 require. The
# server sends no CORS headers and needs none; it is not published at all, so
# this is the browser's only way in. A local process on a Linux host can
# still reach the server at its container address, past these headers, which
# the guide's section 8 says.
#
# Installed as the image's conf.d/default.conf, inside nginx's http block.
# Everything not named below is 404: no SPA fallback, no directory listing,
# no path that reaches the server other than the two it serves.
#
# Two servers. 8080 is the composed stack's origin, and the administrator's
# door behind Cloudflare. 8081 is the runtime door behind Cloudflare (0037):
# it serves no file and forwards only /v1/forms and what is below it, and
# nothing publishes it.

# Hashed bundles never change under their name, so a browser keeps them; the
# pages that name them are revalidated every time, so a rebuilt stack is seen
# on the next load. Set from one map and one add_header: an add_header inside
# a location would silently drop the security headers below for that location,
# which is nginx's rule for inheritance.
map $uri $formancy_cache_control {
    ~^/(studio|host)/assets/  "public, max-age=31536000, immutable";
    ~^/(studio|host)/         "no-cache";
    default                   "";
}

server {
    listen 8080;

    server_tokens off;

    # Redirects say a path, never a host and port: behind compose's port
    # mapping nginx knows only its own 8080, and a Location built from it would
    # send the browser to an address that is not published.
    absolute_redirect off;

    # The data server's BODY_LIMIT (packages/data-server/src/app.ts), so a body
    # the server would refuse is refused here with the same limit rather than
    # a different one.
    client_max_body_size 1m;

    # The pages, their scripts and the third-party notices beside each page
    # are UTF-8, and the notices can say so only here (0046): a browser left
    # to guess the encoding of a bare text/plain can garble a licence's
    # accented name or copyright sign. nginx adds the charset to the types its
    # default charset_types names -- text/html, text/plain and JavaScript among
    # them, not CSS -- so the pages, which declare it in a meta tag as well,
    # carry it too.
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control $formancy_cache_control always;

    # No Content-Security-Policy. React and Angular add inline styles at run
    # time, and a policy nothing has seen working in a browser would be a claim
    # nobody checked (0032).

    location = / {
        return 302 /studio/;
    }

    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        alias /usr/share/formancy-data/studio/;
        index index.html;
    }

    location = /host {
        return 301 /host/;
    }

    location /host/ {
        alias /usr/share/formancy-data/host/;
        index index.html;
    }

    location /v1/ {
        proxy_pass http://server:4390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A write whose answer was lost is the client's to retry, with its own
        # write id, and never the proxy's to send again (0031).
        proxy_next_upstream off;
    }

    location = /health {
        proxy_pass http://server:4390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}

# The runtime door's own server (0037), which the tunnel's runtime rule
# names, so that what a host application's hostname forwards reaches no file.
# cloudflared chooses that door by the path after decoding it, counting a
# backslash as a slash and resolving dot segments; nginx chooses a location
# after decoding the path too, but on Linux keeps a backslash as a character.
# So /studio/..%5Cv1%5Cforms%5CZ/%2E%2E/index.html is /v1/forms/index.html,
# a runtime route, to cloudflared, and /studio/index.html to nginx: on 8080
# it was answered with the studio's page (measured 2026-10-11). Here no
# location serves a file, so whatever nginx makes of a path, it either
# reaches the server's /v1/forms or /v1/forms/, where every runtime route
# is, as sent --
# and the server refuses a path that is not plain before any route's work --
# or is 404. Refused rather than normalised, for 0037's reason: two
# normalisers would have to agree with cloudflared's, which is not written
# down. scripts/cloudflare.mjs sends every path cloudflared forwards to the
# runtime door through this file, and fails on a file or a route's work.
#
# The same body limit, headers and rule against sending a write twice as
# 8080, for the same reasons. No Cache-Control of nginx's own: nothing here is
# a page or a bundle, and the server's answers say no-store themselves.
server {
    listen 8081;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # The menu of forms (0045), the one runtime route with no name below
    # /v1/forms/. Without it, nginx answers /v1/forms itself with a 301 to
    # /v1/forms/, as it does for a prefix location's path without its slash
    # (measured with this file in the web front's nginx, 2026-10-11).
    location = /v1/forms {
        proxy_pass http://server:4390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
    }

    location /v1/forms/ {
        proxy_pass http://server:4390;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
