name: Gates

# The gates every change and every release passes, in one place (0035):
# ci.yml calls this on every pull request and every push to main, and
# release.yml calls it before anything is published, so a release's gate is
# CI's by construction and its report describes its own run. Every job but
# the last ends by collecting what it found into one results file and
# uploading it as `release-results-<key>`; the `report` job builds the
# release report from all of them and fails the run on anything its
# `problems` list (scripts/release-report/report.mjs).
#
# A release runs code from here with its own permissions, so third-party
# actions are pinned to commit hashes, with the tag in a comment, under
# release.yml's rule; scripts/release-report/workflows.test.mjs fails on one
# that is not.
on:
  workflow_call:
    inputs:
      release:
        description: "'' for CI, the tag for a release, dry-run for a rehearsal"
        type: string
        default: ''
    secrets:
      # Passed by ci.yml and never by release.yml, so a release never uploads
      # coverage and holds no secret while it runs the gates.
      CODECOV_TOKEN:
        required: false

# Read-only, for every job. Nothing in this workflow writes to the repository:
# the coverage upload authenticates with its own token, the caches are CI's
# alone and the artefacts the run's. Without this the default token carries
# whatever the repository's default is, and CodeQL says so, as a
# missing-workflow-permissions alert per job.
permissions:
  contents: read

jobs:
  # Build, types, packaging, licences and the repository's own guards: the
  # fast signal. The suites run in the `test` job below, one package per runner.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager field, so CI runs the exact pnpm
      # version the repo pins rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      # CI only. A tag's run may restore a cache a main-branch run saved, and
      # a cache holds whatever code that job ran left in the store; a release
      # or a rehearsal installs from the registry against the lockfile
      # instead, in every job here (workflows.test.mjs).
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      # Packaging correctness (publint + attw) is a release gate, not a nicety:
      # broken exports maps are the top cause of "doesn't work in my app".
      - run: pnpm check:pkg

      # Every tarball carries LICENSE.md and NOTICE and declares the
      # source-available terms rather than the scope's Apache-2.0. On the pull
      # request rather than only at release, which is the last possible moment
      # to find out.
      - run: node scripts/verify-licenses.mjs

      # The repository's own guards: codecov.yml matches its generator, every
      # CLA signature names the current text, upstream is depended on at exact
      # versions, no source file is past the 600-line budget, the `test`
      # job's matrix names every package with a suite and the `test-images`
      # job's every image of the matrix, these workflows keep
      # the shape the release depends on, the release report's registers
      # hold, and docs/performance.md is what its committed results render.
      # A guard that is not a gate is a comment.
      - run: pnpm test:repo

      # What this job found, for the report: the guards' results and the
      # dist/ of every published package it built. Even when a step above
      # failed, so the report says what failed rather than that nothing came.
      # Every upload here overwrites: a job run again replaces its own earlier
      # attempt's artefact, which v4 would otherwise refuse by name, and no two
      # jobs share a key (workflows.test.mjs), so it never replaces another's.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # Every package's suite, each in a job of its own on its own runner. They
  # ran as one `pnpm test:coverage` in `verify` until nine suites at once --
  # five of them starting PostgreSQL and SQL Server, three mounting Angular and
  # React into jsdom -- shared one four-CPU runner: on main (run 37940021594)
  # data-core's pure suite took 51 s, the studio's 235 s, and a studio test
  # that runs in 2 s locally passed its 60 s limit. Raising limits one test at
  # a time was chasing the contention; a runner per suite removes it.
  # scripts/ci-test-jobs.test.mjs fails when this list and the workspace's
  # packages with a `test:coverage` script disagree, so a new package cannot
  # go untested in CI by being left off it.
  #
  # The suites run the adapters against real PostgreSQL and real SQL Server,
  # through testcontainers on the runner's Docker. There is no mocked driver in
  # this repository and there is not going to be one (0003): database
  # semantics are the product, and a suite that passed without a database
  # would be proving the mock.
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    # The suites start a real SQL Server, and its image is close to a gigabyte
    # and a half; the pull is not cached between runs.
    timeout-minutes: 25
    strategy:
      # Every suite reports, rather than the first failure cancelling the rest.
      fail-fast: false
      matrix:
        package: ['@formancy/data-core', '@formancy/data-identity', '@formancy/data-fixtures', '@formancy/data-postgres', '@formancy/data-sqlserver', '@formancy/data-server', '@formancy/data-client', '@formancy/data-performance', '@formancy/data-examples', '@formancy/data-studio', '@formancy/data-host', '@formancy/data-live-demo']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # turbo builds what the package depends on first (`^build`), then runs
      # its suite and nothing else's. `--force` makes "this job did not replay
      # a cached result" a property of the command rather than an accident of
      # a fresh runner; `--summarize` writes the task's own start and end,
      # which the report shows as its wall time. The package reaches the
      # command through the environment, never through `${{ }}` in the script.
      - run: pnpm exec turbo run test:coverage --filter="$PACKAGE" --force --summarize
        env:
          PACKAGE: ${{ matrix.package }}
      # Skipped, visibly, while the repository has no CODECOV_TOKEN -- a new
      # repository should not be red for a reason unrelated to its code -- and
      # in every release, which passes no secret. Once the secret exists the
      # upload runs and a failed upload fails the job, as upstream: a report
      # that silently did not arrive is a number nobody can read. Each job
      # uploads its own package's report; Codecov merges them by commit. A
      # secret cannot be tested in `if:` directly, so it goes through the
      # environment.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # The commit v7 named when it was pinned, read from the action's repository on 2026-10-09.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job test --package "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # data-fixtures and each engine's adapter suite again, on every image of
  # the matrix but the default (0067): packages/data-fixtures' MATRIX_IMAGES,
  # which scripts/ci-test-jobs.test.mjs holds these pairs to, so an image
  # without a leg, or a leg on an image the matrix does not list, is red
  # there. Passing on the default says nothing of 16 or 2019: database
  # semantics are the product (0003), and they move between versions.
  #
  # The `test` job's command, told its image through FORMANCY_IMAGES, which
  # turbo hashes for the suites (turbo.json), so no leg replays a cached run
  # of another image; the image reaches the report from the servers' own
  # records, never from this name. One leg per pair, so a red leg names its
  # package and its image. The server, client, host, studio and performance
  # suites stay on the defaults: they test the server, not the database's
  # semantics. A PostgreSQL leg of data-fixtures starts the default SQL Server
  # too, whose fixture suite starts both engines.
  #
  # No coverage upload: an image leg covers the lines the default leg
  # covers, and Codecov merges every upload of a commit into one.
  test-images:
    name: test-images (${{ matrix.package }}, ${{ matrix.image }})
    runs-on: ubuntu-latest
    # The `test` job's limit, copied: these legs pull other images than its
    # legs do and have not been measured against it (0067); their first CI
    # runs measure them.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: '@formancy/data-fixtures', image: 'postgres:15-alpine' }
          - { package: '@formancy/data-postgres', image: 'postgres:15-alpine' }
          - { package: '@formancy/data-fixtures', image: 'postgres:16-alpine' }
          - { package: '@formancy/data-postgres', image: 'postgres:16-alpine' }
          - { package: '@formancy/data-fixtures', image: 'postgres:18-alpine' }
          - { package: '@formancy/data-postgres', image: 'postgres:18-alpine' }
          - { package: '@formancy/data-fixtures', image: 'mcr.microsoft.com/mssql/server:2019-latest' }
          - { package: '@formancy/data-sqlserver', image: 'mcr.microsoft.com/mssql/server:2019-latest' }
          - { package: '@formancy/data-fixtures', image: 'mcr.microsoft.com/mssql/server:2025-latest' }
          - { package: '@formancy/data-sqlserver', image: 'mcr.microsoft.com/mssql/server:2025-latest' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run test:coverage --filter="$PACKAGE" --force --summarize
        env:
          PACKAGE: ${{ matrix.package }}
          FORMANCY_IMAGES: ${{ matrix.image }}

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job test-images --package "$PACKAGE" --variant "$IMAGE"
        env:
          PACKAGE: ${{ matrix.package }}
          IMAGE: ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # What jsdom cannot see on the examples page, in the studio and on the host
  # page, measured in Chromium, Firefox and WebKit: no sideways scroll down to
  # 320px, the keyboard path through the skip link, colour contrast and target
  # size -- on the
  # examples clean and after a failed submit (0021), in the studio at every
  # step of the journey against the real server, with the preview's paper kept
  # free of the studio's rules (0024), and on the host page at every state of a
  # load, a save, a stale save and a refused selection, with the focus where
  # each leaves it and both papers free of the host's rules (0029). jsdom
  # applies no CSS and performs no layout, so every one of those was a hand
  # check until this job.
  #
  # The host page's gate starts PostgreSQL through testcontainers on the
  # runner's Docker, which ubuntu-24.04 has: what the page shows after a save
  # is the database's answer, and there is no mocked driver (0003). PostgreSQL
  # only -- layout, focus and colour do not depend on the engine.
  #
  # Its own job, as formancy.ai's is: "browser" says what is wrong, where a red
  # "verify" sends the reader into a twenty-minute log to find out. One leg per
  # browser the gates run in (scripts/browsers.mjs's BROWSERS, which
  # scripts/browsers.test.mjs holds to this matrix) -- Chromium, Firefox and
  # WebKit, every check in every one (0058) -- each told its browser through
  # FORMANCY_BROWSERS and leaving its results under its own key, so a red leg
  # names its browser and the report holds each to Playwright's pin. Each leg
  # fails the run and its report, and so blocks a release, whose publish
  # needs the gates, as Chromium's always has. Nothing blocks a merge
  # mechanically: main's ruleset requires no status check (GOVERNANCE.md),
  # and a merge waits for a green run because the merge process says so;
  # `report` is the check to require if that ever changes.
  #
  # Pinned, not ubuntu-latest: WebKit's networking (libsoup), its TLS, its
  # EGL and every leg's fallback fonts are the image's, not Playwright's, so a
  # label that moved would move 0058's facts with no change here.
  # ubuntu-latest was ubuntu-24.04 on 2026-10-12. The thirty minutes are
  # not measured on CI yet: on a 20-CPU sandbox on 2026-10-14 WebKit's three
  # gates took about 8.5 minutes before its install, so fifteen left too little
  # for a slower runner. Each leg keeps thirty until three green runs give a
  # slowest time to triple, as the report job's comment says of its own.
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Cached by the lockfile, which pins the playwright version the browser
      # revision is tied to; in CI only, as the store is. The key carries the
      # browser: with one key for every leg, the first leg to finish would save
      # a cache the others restore without their browser.
      - name: Cache the ${{ matrix.browser }} download
        uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No `--with-deps`, for upstream's reason: it runs apt-get for libraries
      # the hosted runner already ships, and on formancy.ai that once sat for
      # nineteen minutes until the job timed out. If a library is ever missing,
      # the browser fails to launch and the gate prints the command to run. The
      # step timeout is the backstop.
      - run: pnpm --filter @formancy/data-examples exec playwright install "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
        timeout-minutes: 5

      # WebKit's system libraries -- GTK 4, GStreamer, WPE, libsoup 3 and
      # Playwright's tools group (xvfb and its fonts) with them -- and only
      # WebKit's: the other legs run no apt (upstream's nineteen minutes).
      # On a clean ubuntu:24.04 container on 2026-10-13, `install --with-deps
      # webkit` installed 372 packages in 81 s; what the runner's image
      # already has was not measured, and the step stays until the first CI
      # run shows whether WebKit launches there without it (0058).
      # install-deps runs apt-get through sudo itself. Skipped by a typo in
      # the condition, WebKit fails to launch, naming what is missing: closed.
      # Twelve minutes, from the runner's own times: read from GitHub's API
      # on 2026-10-22 over the last 25 CI runs, the step took 26 to 274 s
      # when it ended, and three times it was stopped at 5 minutes while
      # apt was still fetching -- once at its 63rd download of 117 MB for 187
      # packages from azure.archive.ubuntu.com -- not hung. The leg's whole job took 443
      # to 912 s when it passed, so the slowest of those with this step at
      # its limit still ends inside the job's 30 minutes.
      - name: WebKit's system libraries
        if: matrix.browser == 'webkit'
        run: pnpm --filter @formancy/data-examples exec playwright install-deps webkit
        timeout-minutes: 12

      # Builds the page first (turbo's `dependsOn`), then measures it, in this
      # leg's browser alone: turbo passes FORMANCY_BROWSERS to the gates
      # (turbo.json's passThroughEnv, which scripts/browsers.test.mjs holds).
      # Were it dropped, a leg would run the machine default, Chromium, and
      # the leg of any other browser would leave no file of its own, which
      # the collect step below lists as missing.
      - run: pnpm test:browser
        env:
          FORMANCY_BROWSERS: ${{ matrix.browser }}

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job browser --variant "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # The README's pictures, held to the text they show (0038): each app's
  # `pictures.mjs --check`, in Chromium alone, which is the one look the
  # pictures were taken in. A job of its own, not a step of the Chromium leg:
  # a step behind `if: matrix.browser == 'chromium'` that a rename skipped
  # would go unnoticed, where a job is in the report's needs and leaves a
  # results key the report expects. The host's pictures start PostgreSQL
  # through the runner's Docker, as its gate does; pinned to the Chromium
  # leg's image, for its fonts.
  pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The Chromium leg's cache, by the same key.
      - name: Cache the chromium download
        uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @formancy/data-examples exec playwright install chromium
        timeout-minutes: 5

      # Builds the pages first (turbo's `dependsOn`), then walks every scene.
      - run: pnpm test:pictures

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job pictures
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # Every job above runs inside the workspace, against the tree it built from --
  # and a workspace sibling resolves a package through a symlink to its SOURCE
  # directory. So an exports map that is wrong for a real consumer can be right
  # for every test in the repository. This packs the tarballs, installs them
  # into a plain npm project, type-checks it with skipLibCheck OFF and runs it
  # under Node. Its own job so that `verify` stays the fast signal and a red
  # "install" says what is wrong.
  #
  # The tarballs it packed, installed and ran are kept as the artefact
  # `release-tarballs`: they are what a release publishes, byte for byte
  # (0035), so npm never receives a tarball no gate installed.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The tarballs are built output, so there is nothing to pack without this.
      - run: pnpm build

      - run: node scripts/install-test.mjs --keep-tarballs release-tarballs

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job install
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          overwrite: true

  # The image is the product for a self-hoster, and nothing else here touches
  # it. src/dockerfile.test.ts catches a workspace package the COPY list forgot;
  # this catches everything it cannot -- a file the runtime stage drops, a
  # module that resolves in the workspace and not in the deployed tree. formancy's
  # image once built cleanly, passed every test, and exited on startup with
  # ERR_MODULE_NOT_FOUND; this job exists so that is found here instead.
  #
  # Node and nothing else installed, for the collect step: what the report
  # says of this image is labelled as the gate's image, never the published
  # one, which the release builds again and names by digest.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the server image
        run: docker build -f packages/data-server/Dockerfile -t formancy/data-server:ci .

      - name: Unconfigured, it refuses with a sentence rather than starting
        run: |
          output=$(docker run --rm formancy/data-server:ci 2>&1 || true)
          echo "$output"
          if echo "$output" | grep -q 'ERR_MODULE_NOT_FOUND\|Cannot find module'; then
            echo "::error::The image is missing a module at runtime. The build said nothing."
            exit 1
          fi
          if ! echo "$output" | grep -q 'FORMANCY_DATA_IDENTITY_SECRET'; then
            echo "::error::An unconfigured server did not name the setting it needs."
            exit 1
          fi

      - name: Configured, it serves health and refuses an unauthenticated request
        run: |
          docker run -d --name data-server -p 127.0.0.1:4390:4390 \
            -e FORMANCY_DATA_ISSUER=https://host.example \
            -e FORMANCY_DATA_AUDIENCE=formancy-data \
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET \
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes \
            formancy/data-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4390/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4390/health || { docker logs data-server; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4390/v1/whoami)
          if [ "$status" != "401" ]; then
            echo "::error::whoami without a token answered $status, expected 401"
            exit 1
          fi
          # Unprivileged, and carrying its licence.
          test "$(docker exec data-server id -un)" = "node"
          docker exec data-server test -f /app/LICENSE.md
          # The store's directory is the server's own to write. Docker gives a
          # new named volume the owner of the image directory it is mounted
          # on, so without the Dockerfile's mkdir and chown a composed
          # stack's first publish fails (0032).
          docker exec data-server test -w /var/lib/formancy-data || {
            echo "::error::/var/lib/formancy-data is not writable by the server's user"
            exit 1
          }
          docker rm -f data-server

      # FORMANCY_DATA_RATE_LIMIT is a public setting (0034). rate-limit.test.ts
      # holds how it is parsed; only the running image shows main.ts reads it:
      # a limit of 2 answers the third request 429, and a value that is not a
      # whole number stops a server that is otherwise configured, with the
      # sentence naming it, rather than starting with the default. The second
      # container runs detached and is waited for, so a server that ignored
      # the setting fails this step instead of holding it until the timeout.
      - name: FORMANCY_DATA_RATE_LIMIT sets the limit, and a value that is not one stops the server
        run: |
          configured=(
            -e FORMANCY_DATA_ISSUER=https://host.example
            -e FORMANCY_DATA_AUDIENCE=formancy-data
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes
          )
          docker run -d --name data-server-limited -p 127.0.0.1:4390:4390 \
            "${configured[@]}" -e FORMANCY_DATA_RATE_LIMIT=2 formancy/data-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4390/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4390/health || { docker logs data-server-limited; exit 1; }
          statuses=$(for _ in 1 2 3; do curl -s -o /dev/null -w ' %{http_code}' http://127.0.0.1:4390/v1/whoami; done)
          docker rm -f data-server-limited
          if [ "$statuses" != " 401 401 429" ]; then
            echo "::error::With FORMANCY_DATA_RATE_LIMIT=2, three requests answered${statuses}; expected 401 401 429"
            exit 1
          fi

          docker run -d --name data-server-misconfigured \
            "${configured[@]}" -e FORMANCY_DATA_RATE_LIMIT=abc formancy/data-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' data-server-misconfigured)" = false ] && break
            sleep 1
          done
          running=$(docker inspect -f '{{.State.Running}}' data-server-misconfigured)
          code=$(docker inspect -f '{{.State.ExitCode}}' data-server-misconfigured)
          output=$(docker logs data-server-misconfigured 2>&1)
          docker rm -f data-server-misconfigured
          echo "$output"
          if [ "$running" != false ] || [ "$code" = 0 ]; then
            echo "::error::With FORMANCY_DATA_RATE_LIMIT=abc the server was still running after 30 s, or exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q 'FORMANCY_DATA_RATE_LIMIT is a whole number'; then
            echo "::error::With FORMANCY_DATA_RATE_LIMIT=abc the server stopped without naming the setting"
            exit 1
          fi

      # FORMANCY_DATA_LOOKUP_DEADLINE_MS is a public setting (0061).
      # lookup-deadline.test.ts holds how it is parsed, and the server's
      # lookup-limits suite what a deadline does; only the running image shows
      # main.ts reads it: a value that is not a whole number of milliseconds
      # stops a server that is otherwise configured, with the sentence naming
      # the variable, rather than starting with the default. Detached and
      # waited for, as the rate limit's step is, so a server that ignored the
      # setting fails this step instead of holding it until the timeout.
      - name: A FORMANCY_DATA_LOOKUP_DEADLINE_MS that is not a number of milliseconds stops the server
        run: |
          docker run -d --name data-server-deadline             -e FORMANCY_DATA_ISSUER=https://host.example             -e FORMANCY_DATA_AUDIENCE=formancy-data             -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET             -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes             -e FORMANCY_DATA_LOOKUP_DEADLINE_MS=abc formancy/data-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' data-server-deadline)" = false ] && break
            sleep 1
          done
          running=$(docker inspect -f '{{.State.Running}}' data-server-deadline)
          code=$(docker inspect -f '{{.State.ExitCode}}' data-server-deadline)
          output=$(docker logs data-server-deadline 2>&1)
          docker rm -f data-server-deadline
          echo "$output"
          if [ "$running" != false ] || [ "$code" = 0 ]; then
            echo "::error::With FORMANCY_DATA_LOOKUP_DEADLINE_MS=abc the server was still running after 30 s, or exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q 'FORMANCY_DATA_LOOKUP_DEADLINE_MS is a whole number of milliseconds'; then
            echo "::error::With FORMANCY_DATA_LOOKUP_DEADLINE_MS=abc the server stopped without naming the setting"
            exit 1
          fi

      # A path a proxy could read differently from the router is refused
      # before any route's work (0037): cloudflared 2026.10.0 was measured
      # sending /v1/forms/a/versions/..%2F..%2Fb to a door meant for the
      # runtime route /v1/forms/b, while Fastify, routing the path as sent,
      # ran the administrator's version read for it. paths.test.ts and
      # app.test.ts hold the rule on the source; only the running image
      # shows main.ts serves the server they test. --path-as-is, so curl
      # sends the path exactly as written.
      - name: A path that is not plain is answered 400 path-not-plain
        run: |
          docker run -d --name data-server-paths -p 127.0.0.1:4390:4390 \
            -e FORMANCY_DATA_ISSUER=https://host.example \
            -e FORMANCY_DATA_AUDIENCE=formancy-data \
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET \
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes \
            formancy/data-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4390/health && break
            sleep 1
          done
          answer=$(curl -s --path-as-is -w ' %{http_code}' 'http://127.0.0.1:4390/v1/forms/a/versions/..%2F..%2Fb')
          docker rm -f data-server-paths
          echo "$answer"
          if [ "${answer##* }" != "400" ] || ! echo "$answer" | grep -q '"code":"path-not-plain"'; then
            echo "::error::A path holding ..%2F was not answered 400 path-not-plain"
            exit 1
          fi

      # Every answer says Cache-Control: no-store (0037): a form id may end
      # in .js, which a CDN caches by extension, and a cache that does not
      # treat Authorization as private would hand one person's form to the
      # next. app.test.ts holds it for every kind of answer; this holds the
      # image's.
      - name: Every answer says Cache-Control no-store
        run: |
          docker run -d --name data-server-no-store -p 127.0.0.1:4390:4390 \
            -e FORMANCY_DATA_ISSUER=https://host.example \
            -e FORMANCY_DATA_AUDIENCE=formancy-data \
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET \
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes \
            formancy/data-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4390/health && break
            sleep 1
          done
          health=$(curl -s -i http://127.0.0.1:4390/health)
          refused=$(curl -s -i http://127.0.0.1:4390/v1/whoami)
          docker rm -f data-server-no-store
          for answer in "$health" "$refused"; do
            echo "$answer" | head -n 1
            if ! echo "$answer" | tr -d '\r' | grep -qi '^cache-control: no-store$'; then
              echo "::error::An answer of the server carried no Cache-Control: no-store"
              exit 1
            fi
          done

      # FORMANCY_DATA_IDENTITY_KEYS_FILE is read again on SIGHUP (0059).
      # identity-file.test.ts and identity-settings.test.ts hold the reading
      # and the listener on the source; only the image shows that Node as
      # PID 1 receives docker's SIGHUP once main.ts listens for it, that the
      # mounted file is the one read again, and that the image's
      # identity-keys-cli.mjs refuses what the server would. Keys a and b are
      # made here and kept outside the mounted directory; both tokens are
      # minted inside the container before any file is swapped, from each key
      # piped over stdin, and are never printed. Without the listener the
      # first wait below times out. The log is searched last for every
      # eight characters of each key, and for each token.
      - name: A key set file is read again on SIGHUP, and a bad one leaves the set in force
        run: |
          material="$RUNNER_TEMP/material"
          identity="$RUNNER_TEMP/identity"
          mkdir -p "$material" "$identity"
          chmod 755 "$identity"
          node -e 'const { randomBytes } = require("node:crypto"); for (const kid of ["a", "b"]) require("node:fs").writeFileSync(`${process.argv[1]}/${kid}.json`, JSON.stringify({ kty: "oct", kid, k: randomBytes(32).toString("base64url") }))' "$material"
          set_of() { node -e 'process.stdout.write(JSON.stringify({ keys: process.argv.slice(1).map((file) => JSON.parse(require("node:fs").readFileSync(file, "utf8"))) }))' "$@"; }
          set_of "$material/a.json" > "$identity/keys.json"

          docker run -d --name data-server-keys -p 127.0.0.1:4390:4390 \
            -v "$identity:/run/identity:ro" \
            -e FORMANCY_DATA_ISSUER=https://host.example \
            -e FORMANCY_DATA_AUDIENCE=formancy-data \
            -e FORMANCY_DATA_IDENTITY_KEYS_FILE=/run/identity/keys.json \
            -e FORMANCY_DATA_IDENTITY_ALGORITHM=HS256 \
            formancy/data-server:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4390/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4390/health > /dev/null || { docker logs data-server-keys; exit 1; }
          if ! docker logs data-server-keys 2>&1 | grep -q '"identityKeys":{"kids":\["a"\]'; then
            echo "::error::The planes line did not name the key set's kids"
            exit 1
          fi

          mint=$(cat <<'JS'
          import { createSecretKey } from 'node:crypto'
          import { createRequire } from 'node:module'
          import { pathToFileURL } from 'node:url'
          const { SignJWT } = await import(pathToFileURL(createRequire('/app/package.json').resolve('jose')).href)
          let text = ''
          for await (const chunk of process.stdin) text += chunk
          const jwk = JSON.parse(text)
          process.stdout.write(await new SignJWT({ sub: 'ci' }).setProtectedHeader({ alg: 'HS256', kid: jwk.kid }).setIssuer('https://host.example').setAudience('formancy-data').setExpirationTime('10m').sign(createSecretKey(Buffer.from(jwk.k, 'base64url'))))
          JS
          )
          A=$(docker exec -i data-server-keys node --input-type=module -e "$mint" < "$material/a.json")
          B=$(docker exec -i data-server-keys node --input-type=module -e "$mint" < "$material/b.json")
          [ -n "$A" ] && [ -n "$B" ] || { echo "::error::No token was minted inside the container"; exit 1; }

          whoami() { curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $1" http://127.0.0.1:4390/v1/whoami; }
          expect() {
            local got
            got="$(whoami "$A") $(whoami "$B")"
            if [ "$got" != "$1" ]; then
              echo "::error::$2: tokens A and B answered $got, expected $1"
              docker logs data-server-keys
              exit 1
            fi
          }
          seen() { docker logs data-server-keys 2>&1 | grep -c "$1" || true; }
          wait_for() {
            for _ in $(seq 1 20); do
              [ "$(seen "$1")" -ge "$2" ] && return 0
              sleep 0.5
            done
            echo "::error::Waited 10 s for \"$1\" in the server's log after SIGHUP"
            docker logs data-server-keys
            exit 1
          }
          swap_in() {
            mv "$identity/next.json" "$identity/keys.json"
            docker kill --signal HUP data-server-keys > /dev/null
          }

          expect "200 401" "With the set {a}"

          set_of "$material/a.json" "$material/b.json" > "$identity/next.json"
          listed=$(docker exec data-server-keys node dist/identity-keys-cli.mjs check /run/identity/next.json HS256)
          if [ "$listed" != "$(printf 'in force: a, b\nleft out: none')" ]; then
            echo "::error::identity-keys-cli.mjs check listed: $listed"
            exit 1
          fi
          swap_in
          wait_for 'identity keys read again"' 1
          expect "200 200" "After {a, b} was moved in and the server was sent SIGHUP"

          set_of "$material/b.json" > "$identity/next.json"
          swap_in
          wait_for 'identity keys read again"' 2
          expect "401 200" "After {b} was moved in and the server was sent SIGHUP"

          printf '{"keys":[' > "$identity/next.json"
          if docker exec data-server-keys node dist/identity-keys-cli.mjs check /run/identity/next.json HS256; then
            echo "::error::identity-keys-cli.mjs check accepted a file that is not JSON"
            exit 1
          fi
          swap_in
          wait_for 'identity keys not read again' 1
          expect "401 200" "After a malformed file was moved in and the server was sent SIGHUP"
          if [ "$(docker inspect -f '{{.State.Running}}' data-server-keys)" != true ]; then
            echo "::error::The server stopped after a SIGHUP"
            exit 1
          fi

          logs=$(docker logs data-server-keys 2>&1)
          docker rm -f data-server-keys > /dev/null
          for kid in a b; do
            k=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).k)' "$material/$kid.json")
            for start in $(seq 0 $(( ${#k} - 8 ))); do
              case "$logs" in *"${k:$start:8}"*)
                echo "::error::The server's log holds eight characters of key $kid"
                exit 1
                ;;
              esac
            done
          done
          case "$logs" in *"$A"*|*"$B"*)
            echo "::error::The server's log holds a token"
            exit 1
            ;;
          esac
          rm -rf "$material" "$identity"

      # FORMANCY_DATA_CORS_ORIGINS (0060). cors.test.ts and
      # cross-origin.test.ts hold the setting, the grants and the refusals on
      # the source; only the image shows that main.ts reads the setting and
      # hands it to the runtime plane. With both planes on -- the store, the
      # allowlist, which is opened lazily, and administrator roles -- and one
      # origin listed: a preflight from it is granted and one from another is
      # not, an unauthenticated runtime answer carries the listed origin back,
      # a token-bearing request a browser marks cross-site from an unlisted
      # origin is refused before its token is read, and the administrator's
      # plane has no preflight route at all. A wildcard stops a server that is
      # otherwise configured, naming the setting; an empty value is no list,
      # and a server with no store starts with it and grants nothing. Without
      # main.ts passing the list, the first preflight is the router's 404.
      - name: FORMANCY_DATA_CORS_ORIGINS answers a listed origin on the runtime plane, refuses a request riding another, and a wildcard stops the server
        run: |
          configured=(
            -e FORMANCY_DATA_ISSUER=https://host.example
            -e FORMANCY_DATA_AUDIENCE=formancy-data
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes
          )
          planes=(
            -v "$PWD/deploy/connections.json:/run/formancy/connections.json:ro"
            -e FORMANCY_DATA_CONNECTIONS=/run/formancy/connections.json
            -e FORMANCY_DATA_STORE_DIR=/var/lib/formancy-data
            -e FORMANCY_DATA_ADMIN_ROLES=data-admin
          )
          healthy() {
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:4390/health > /dev/null && return 0
              sleep 1
            done
            docker logs "$1"
            exit 1
          }
          # One answer as "status allow-origin", or "status -" when it carries none.
          answer() {
            curl -s -o /dev/null -D - "$@" | tr -d '\r' | awk 'NR == 1 { status = $2 } tolower($1) == "access-control-allow-origin:" { origin = $2 } END { print status " " (origin == "" ? "-" : origin) }'
          }
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 answered \"$2\", expected \"$3\""
              exit 1
            fi
          }

          docker run -d --name data-server-origins -p 127.0.0.1:4390:4390 \
            "${configured[@]}" "${planes[@]}" -e FORMANCY_DATA_CORS_ORIGINS=https://app.example \
            formancy/data-server:ci
          healthy data-server-origins
          granted=$(answer -X OPTIONS -H 'origin: https://app.example' -H 'access-control-request-method: GET' http://127.0.0.1:4390/v1/forms)
          unlisted=$(answer -X OPTIONS -H 'origin: https://other.example' -H 'access-control-request-method: GET' http://127.0.0.1:4390/v1/forms)
          refusal=$(answer -H 'origin: https://app.example' http://127.0.0.1:4390/v1/forms)
          riding=$(answer -H 'authorization: Bearer not-read' -H 'sec-fetch-site: cross-site' -H 'origin: https://other.example' http://127.0.0.1:4390/v1/forms)
          administrator=$(answer -X OPTIONS -H 'origin: https://app.example' -H 'access-control-request-method: GET' http://127.0.0.1:4390/v1/connections)
          docker rm -f data-server-origins > /dev/null
          check "A preflight for GET /v1/forms from the listed origin" "$granted" "204 https://app.example"
          check "A preflight for GET /v1/forms from an unlisted origin" "$unlisted" "403 -"
          check "GET /v1/forms from the listed origin with no token" "$refusal" "401 https://app.example"
          check "GET /v1/forms with a token, cross-site, from an unlisted origin" "$riding" "403 -"
          check "A preflight for GET /v1/connections" "$administrator" "404 -"

          docker run -d --name data-server-wildcard \
            "${configured[@]}" "${planes[@]}" -e 'FORMANCY_DATA_CORS_ORIGINS=*' formancy/data-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' data-server-wildcard)" = false ] && break
            sleep 1
          done
          running=$(docker inspect -f '{{.State.Running}}' data-server-wildcard)
          code=$(docker inspect -f '{{.State.ExitCode}}' data-server-wildcard)
          output=$(docker logs data-server-wildcard 2>&1)
          docker rm -f data-server-wildcard > /dev/null
          echo "$output"
          if [ "$running" != false ] || [ "$code" = 0 ]; then
            echo "::error::With FORMANCY_DATA_CORS_ORIGINS=* the server was still running after 30 s, or exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q 'FORMANCY_DATA_CORS_ORIGINS: entry 1 '; then
            echo "::error::With FORMANCY_DATA_CORS_ORIGINS=* the server stopped without naming the setting"
            exit 1
          fi

          docker run -d --name data-server-no-origins -p 127.0.0.1:4390:4390 \
            "${configured[@]}" -e FORMANCY_DATA_CORS_ORIGINS= formancy/data-server:ci
          healthy data-server-no-origins
          empty=$(answer -X OPTIONS -H 'origin: https://app.example' -H 'access-control-request-method: GET' http://127.0.0.1:4390/v1/forms)
          docker rm -f data-server-no-origins > /dev/null
          check "With FORMANCY_DATA_CORS_ORIGINS empty and no store, a preflight for GET /v1/forms" "$empty" "404 -"

      # FORMANCY_DATA_TRUSTED_PROXIES (0071). trusted-proxies.test.ts and
      # forwarded.test.ts hold the setting and whom the server believes on
      # the source; only the image shows that main.ts reads it and hands it
      # to the server. The requests are sent from inside the container, so
      # the peer is 127.0.0.1 on every runner, whatever Docker's port
      # forwarding makes of a request from the host. With 127.0.0.1 named and
      # a limit of two, each forwarded address is a bucket of its own: the
      # fourth request, from a second address, is answered 401, where a
      # server that ignored the setting answers 429. `true` stops a server
      # that is otherwise configured, naming the setting.
      - name: FORMANCY_DATA_TRUSTED_PROXIES splits the limit by the address a named proxy forwards, and true stops the server
        run: |
          configured=(
            -e FORMANCY_DATA_ISSUER=https://host.example
            -e FORMANCY_DATA_AUDIENCE=formancy-data
            -e FORMANCY_DATA_IDENTITY_SECRET=env:HOST_SECRET
            -e HOST_SECRET=a-shared-secret-of-at-least-thirty-two-bytes
          )
          docker run -d --name data-server-proxied             "${configured[@]}" -e FORMANCY_DATA_RATE_LIMIT=2 -e FORMANCY_DATA_TRUSTED_PROXIES=127.0.0.1 formancy/data-server:ci
          up=false
          for _ in $(seq 1 30); do
            docker exec data-server-proxied node -e "fetch('http://127.0.0.1:4390/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && up=true && break
            sleep 1
          done
          if [ "$up" != true ]; then docker logs data-server-proxied; exit 1; fi
          statuses=$(docker exec data-server-proxied node --input-type=module -e "
            const from = ['198.51.100.7', '198.51.100.7', '198.51.100.7', '198.51.100.8']
            const answers = []
            for (const address of from) answers.push((await fetch('http://127.0.0.1:4390/v1/whoami', { headers: { 'x-forwarded-for': address } })).status)
            console.log(answers.join(' '))
          ")
          docker rm -f data-server-proxied > /dev/null
          if [ "$statuses" != "401 401 429 401" ]; then
            echo "::error::With FORMANCY_DATA_TRUSTED_PROXIES=127.0.0.1, three requests forwarded for one address and one for another answered ${statuses}; expected 401 401 429 401"
            exit 1
          fi

          docker run -d --name data-server-trust-all             "${configured[@]}" -e FORMANCY_DATA_TRUSTED_PROXIES=true formancy/data-server:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' data-server-trust-all)" = false ] && break
            sleep 1
          done
          running=$(docker inspect -f '{{.State.Running}}' data-server-trust-all)
          code=$(docker inspect -f '{{.State.ExitCode}}' data-server-trust-all)
          output=$(docker logs data-server-trust-all 2>&1)
          docker rm -f data-server-trust-all > /dev/null
          echo "$output"
          if [ "$running" != false ] || [ "$code" = 0 ]; then
            echo "::error::With FORMANCY_DATA_TRUSTED_PROXIES=true the server was still running after 30 s, or exited 0"
            exit 1
          fi
          if ! echo "$output" | grep -q 'FORMANCY_DATA_TRUSTED_PROXIES: entry 1 trusts every peer'; then
            echo "::error::With FORMANCY_DATA_TRUSTED_PROXIES=true the server stopped without naming the setting"
            exit 1
          fi

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job container --image formancy/data-server:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # docs/getting-started.md, run as written (0032): its own commands, in order,
  # from this clean checkout, then propose, publish, lookup, create, a create
  # sent again, update, a stale update and another tenant's refusal over HTTP
  # through the composed stack's one origin, on PostgreSQL and SQL Server; and
  # it fails if a secret or a token reaches a log, compose's configuration or
  # a container's inspect. Release gate 9 asked for clean-install
  # documentation that works, and a guide nothing runs is a claim nobody
  # checked. Each database's version, as the server's own adapter reports it,
  # is recorded for the report beside every suite's (0035).
  #
  # Node and nothing else: no corepack, no pnpm install. The guide's reader
  # has Docker and git, and the gate runs on Node's built-ins, so the
  # checkout is as clean as theirs; so does the collect step. The step table
  # and the image sizes go in the job summary, which is where 0032's
  # measurements come from. The limit is the gate's twenty minutes for the
  # first start -- two image builds and SQL Server's pull -- with the journey
  # and the teardown after it.
  #
  # Twice: with the runner's own Compose, and with the oldest release the
  # guide's section 0 says works, so that sentence fails here the day
  # compose.yaml needs a newer one. It is 2.20 because 2.19.1 refuses
  # compose.yaml outright (the web healthcheck's start_interval), measured on
  # 2026-10-09; steps.test.mjs fails when the guide and this pin disagree.
  getting-started:
    name: getting-started (Compose ${{ matrix.compose }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - compose: runner
          - compose: 2.20.3
            # The release's own docker-compose-linux-x86_64.sha256.
            sha256: f45e4cb687df8b48a57f656097ce7175fa8e8bef70be407b011e29ff663f475f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The user's plugin directory comes before the system's, so this
      # Compose is the one every `docker compose` in the job runs.
      - name: Compose ${{ matrix.compose }}
        if: matrix.compose != 'runner'
        env:
          COMPOSE: ${{ matrix.compose }}
          COMPOSE_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose "https://github.com/docker/compose/releases/download/v${COMPOSE}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          test "$(docker compose version --short)" = "${COMPOSE}"

      - run: node scripts/getting-started.mjs

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job getting-started --variant "$COMPOSE"
        env:
          COMPOSE: ${{ matrix.compose }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # docs/deploy/cloudflare.md's overlay, offline (0037): `pnpm
  # test:cloudflare` resolves both Compose files and holds the overlay to
  # what the guide says of it, builds the tools image, runs the guide's
  # configure step with a random fake tunnel, asks the pinned cloudflared
  # what the configuration it wrote means, starts cloudflared as the overlay
  # does with no network to see it read its files, and sends a corpus of
  # paths cloudflared reads differently from the router or from nginx
  # through cloudflared and, where it is forwarded, to the built server,
  # which must refuse each, and through deploy/web/nginx.conf's server for
  # the runtime door in the web front's own nginx, which must end each at
  # that refusal or its own 404, never a file. No Cloudflare account is
  # reached: nothing here can. Twice, with the
  # runner's Compose and with 2.20.3, the oldest getting-started names,
  # which resolved both files alike when this was written.
  #
  # The limit is verify's: the gate alone took 43 to 71 s on 2026-10-11,
  # with both images cached, on the shared Docker Sandbox VM 0037 names, and it
  # has not been measured on CI; three green runs give a slowest time to
  # triple, as the report job's comment says of its own.
  cloudflare:
    name: cloudflare (Compose ${{ matrix.compose }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - compose: runner
          - compose: 2.20.3
            # The release's own docker-compose-linux-x86_64.sha256.
            sha256: f45e4cb687df8b48a57f656097ce7175fa8e8bef70be407b011e29ff663f475f
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Compose ${{ matrix.compose }}
        if: matrix.compose != 'runner'
        env:
          COMPOSE: ${{ matrix.compose }}
          COMPOSE_SHA256: ${{ matrix.sha256 }}
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose "https://github.com/docker/compose/releases/download/v${COMPOSE}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c
          chmod +x ~/.docker/cli-plugins/docker-compose
          test "$(docker compose version --short)" = "${COMPOSE}"

      # The server the differential sends its paths to, as every other job
      # builds it.
      - run: pnpm exec turbo run build --filter=@formancy/data-server

      - run: pnpm test:cloudflare

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job cloudflare --variant "$COMPOSE"
        env:
          COMPOSE: ${{ matrix.compose }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # The live demo at formancy.ai/data/demo/ (0070), end to end on this
  # runner: `pnpm test:live-demo` builds the host page's demo build and
  # deploy/demo/Dockerfile's image, and runs the Worker's own module in
  # front of it, over a stand-in for Cloudflare's runtime whose containers
  # are `docker run`s of the image at the share of the instance type the
  # Worker's config asks for. It walks a visitor's journey over HTTP and in
  # Chromium: the session, each persona's menu, paging, a search, a
  # typeahead, writes and refusals, a second visitor's own data, the reset,
  # and the page under its headers with no policy violation and axe clean.
  # The deploy is not transactional and Workers Builds does not wait for
  # CI, so an image that no longer builds would first fail on Cloudflare,
  # after the new Worker was live. No Cloudflare account is reached:
  # nothing here can.
  #
  # The limit is the container job's. On the Windows workstation on
  # 2026-10-17 the whole gate took 125 s with the image's install cached,
  # and the image's build alone 314 s with it not; it has not been measured
  # on CI, and three green runs give a slowest time to triple, as the report
  # job's comment says of its own.
  live-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The Chromium leg's cache, by the same key.
      - name: Cache the chromium download
        uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm --filter @formancy/data-host exec playwright install chromium
        timeout-minutes: 5

      # The Worker's module and its pure parts, and everything the host
      # page's demo build imports.
      - run: pnpm exec turbo run build --filter=@formancy/data-live-demo... --filter=@formancy/data-host...

      - run: pnpm test:live-demo

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job live-demo
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # The release report (0035), built from what every job above found: what
  # this run was tested on, every package's results, every shared case on
  # every image of both engines' matrix (0067), the build identity of what a
  # release publishes, the release gates and the known limitations. It fails
  # the run on anything in its problems -- a job that ended other than
  # success, an artefact missing, twice or another run's, a test skipped or
  # failed, a shared case missing on an engine or an image, an image of the
  # matrix that answered no test, two builds of one package that differ --
  # and writes the report either way, into the job summary and the
  # `release-report` artefact. For a release or a rehearsal it also writes
  # the release body, and fails here, before anything is published, when the
  # body has no changelog section or is longer than GitHub accepts.
  #
  # The limit is not measured on CI yet: it is verify's, whose install and
  # build this job shares, until three green runs give a slowest time to
  # triple (0035 says so). The checkout keeps the whole history, for a
  # document's last change when a gate's evidence is a document.
  report:
    needs: [verify, test, test-images, browser, pictures, install, container, getting-started, cloudflare, live-demo]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # DATABASE_KINDS, DEFAULT_IMAGES, MATRIX_IMAGES, sharedCases() and
      # SQLSERVER_LOGINS, from the built code that uses them: every package
      # tested-on.mjs's BUILT_INPUTS names, which workflows.test.mjs holds.
      - run: pnpm exec turbo run build --filter=@formancy/data-fixtures --filter=@formancy/data-sqlserver

      # One directory per artefact, never merged: two jobs that wrote one key
      # stay two, and the report says so.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-results-*
          path: release-results

      - name: The report, from what every job found
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node scripts/release-report/report.mjs --results release-results --out release-report

      - name: The report, in the run's summary
        if: ${{ !cancelled() }}
        run: cat release-report/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-report
          path: release-report/
          if-no-files-found: error
          overwrite: true
