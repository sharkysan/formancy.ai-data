name: Release

# Publishing happens here and nowhere else. A release cut from a laptop cannot
# carry provenance -- the attestation is a statement by GitHub about which
# workflow, at which commit, produced the tarball, and only the workflow can
# make it.
#
# In this order (0035): the gates CI runs, and the report of this run; then,
# in a job that holds `contents: read` and no secret, every check on what
# would be published, pinned by hash; then, only on a version tag's push,
# everything permanent, in one job that publishes only what was pinned. A
# `workflow_dispatch` rehearses all of it but that last job, on any branch,
# with no secret and no permission beyond reading the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Third-party actions are pinned to commit hashes, with the tag in a comment.
#
# This workflow holds an npm token and an OIDC identity that can sign on the
# project's behalf. A tag is a mutable pointer: whoever controls an action's
# repository can move `v3` to different code, and that code would run here with
# both. Updating one means reading what changed and writing a new hash. That is
# the cost, and it is also the point.
permissions:
  contents: read

jobs:
  # Whether this run publishes, decided once. The condition is positive and
  # written in this one place: a dispatch can never satisfy it, and an output
  # that is missing is '', which is not 'true'. `release` names everything
  # this run writes -- the tag when publishing, `dry-run` otherwise -- so no
  # file name below is built from a ref, and a dispatch from `feat/x` cannot
  # put a `/` into a path.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publishing: ${{ steps.mode.outputs.publishing }}
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Publishing only on the push of a version tag
        id: mode
        env:
          PUBLISHING: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHING" = true ]; then
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release=dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: The version the packages say
        id: version
        run: echo "version=$(node -p "require('./packages/data-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # The tag is the claim; this checks the repository agrees with it. A tag
      # that says v0.1.0 on a tree that says 0.2.0 would publish the wrong
      # version under the right name, which is unfixable after the fact.
      - name: The tag and the manifests must agree
        if: steps.mode.outputs.publishing == 'true'
        env:
          RELEASE: ${{ steps.mode.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${RELEASE#v}" != "$VERSION" ]; then
            echo "::error::The tag is ${RELEASE} but the packages say ${VERSION}"
            exit 1
          fi
          echo "Releasing $VERSION"

  # Beside the gates, so a missing or refused token is red while they run
  # rather than after them. A rehearsal skips it and needs no secret.
  #
  # The token is a secret of the `npm` environment, whose deployment policy
  # admits only `v*` tags (REPO-METADATA.md): a repository secret would be
  # readable by a workflow on any branch a collaborator pushes. That policy
  # is a repository setting, which nothing in this repository can see.
  npm-token:
    needs: tag
    if: needs.tag.outputs.publishing == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The npm token must work, and must not want an OTP
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository"
            exit 1
          fi
          WHO=$(npm whoami 2>&1) || {
            echo "::error::npm rejected the token: ${WHO}"
            exit 1
          }
          echo "Authenticated as ${WHO}"
          # A classic "Publish" token on an account set to auth-and-writes
          # demands a one-time password for every publish, and CI has no
          # terminal to type one into -- it fails AFTER the whole gate has run.
          if npm profile get 2>/dev/null | grep -q "auth-and-writes"; then
            echo "::warning::Account enforces 2FA on writes. The token must be an \
          Automation or Granular Access token, or publish will fail. See RELEASING.md."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Exactly the gates CI runs, each package's suite on a runner of its own,
  # the browser, install, container and getting-started gates, and the
  # report of this run, which writes the release body. No secret is passed:
  # the coverage upload never runs in a release.
  gates:
    needs: tag
    uses: ./.github/workflows/gates.yml
    with:
      release: ${{ needs.tag.outputs.release }}

  # Every check on what would be published, in a job that holds
  # `contents: read` and no secret: the report is green and is this run's, of
  # this commit, release and version; the tarballs are the install gate's,
  # byte for byte, one per published package, each at the release's version
  # and carrying its licence; the release body exists and fits; the SBOM
  # names both drivers, and every runtime dependency and upstream package it
  # names at the version the suites loaded; and the published performance
  # figures were measured on this product (0034).
  #
  # It is not a job that can write nothing: like every job of a run it can
  # write to the run's artefacts, and it uploads the SBOM. So what it checked
  # is pinned by sha256 as its outputs -- the report and the tarballs before
  # cdxgen runs, whose dependencies nothing locks, the SBOM once it is
  # checked -- and `publish` refuses anything it downloads that is not that.
  # No cache is restored here: a tag's run may restore one a main-branch run
  # saved.
  check:
    needs: [tag, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checked: ${{ steps.report-checked.outputs.checked }}
      sbom: ${{ steps.sbom-checked.outputs.checked }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      # cdxgen reads the installed tree, and so does the figures' check.
      - run: pnpm install --frozen-lockfile

      # docs/performance.md publishes what the measurement recorded about the
      # product it ran: the source files it ran, found by following its
      # imports, the server's and the client's installed dependencies by
      # version, and the build inputs (0034). A release whose product differs
      # is not cut until somebody re-measures on a quiet machine and commits
      # the figures, and a rehearsal says so before a tag is pushed. It reads
      # the source and node_modules, so it needs the install and not the
      # build. Nothing here measures: a runner is shared, and a time taken on
      # one is not a figure. CI does not run it, so a pull request that changes
      # the product is not held until somebody re-measures (0034).
      # performance-stale.test.mjs fails when `publish` stops waiting for it.
      - name: The published performance figures describe this product
        id: performance-figures
        run: node scripts/performance-stale.mjs

      - uses: actions/download-artifact@v4
        with:
          name: release-report
          path: release-report
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs

      - name: The report and the tarballs are what this run gated
        id: report-checked
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          node scripts/release-report/verify-publish.mjs --stage content \
            --report release-report/release-report.json \
            --tarballs release-tarballs \
            --notes release-report/RELEASE_NOTES.md \
            --release "${RELEASE}" \
            --version "${VERSION}"

      # A bill of materials for what actually ships, so a customer -- or an
      # auditor -- can answer "what is in this" without resolving it
      # themselves. --required-only because an SBOM for a released artefact
      # should describe the artefact, not the workbench.
      - name: Generate a CycloneDX SBOM
        id: sbom
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          npx --yes @cyclonedx/cdxgen@12.8.4 \
            --type javascript \
            --required-only \
            --output "formancy-data-${RELEASE}-sbom.cdx.json" \
            --project-name formancy-data \
            --project-version "${VERSION}" \
            .

      - name: The SBOM names what the suites loaded
        id: sbom-checked
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
        run: |
          node scripts/release-report/verify-publish.mjs --stage sbom \
            --report release-report/release-report.json \
            --sbom "formancy-data-${RELEASE}-sbom.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: formancy-data-${{ needs.tag.outputs.release }}-sbom.cdx.json
          if-no-files-found: error
          overwrite: true

  # Everything that cannot be taken back, and the only job with any
  # permission beyond reading. The job-level condition is the boundary: no
  # step here carries an `if` of its own, so a step added later is guarded
  # without anybody remembering to guard it. Nothing is installed or built
  # for npm here; it publishes the tarballs `check` passed, and first refuses
  # anything it downloaded that is not what `check` pinned, and a report that
  # is not this run's -- before anything is signed, and again in the step
  # that holds the npm token.
  #
  # Ordered so that npm, whose version numbers nothing can delete, comes as
  # late as possible: signatures, then the image, then npm, then the GitHub
  # release, which can be edited or deleted. A re-run of this job resumes:
  # publish.mjs skips a version npm already holds with the same bytes.
  publish:
    needs: [tag, npm-token, gates, check]
    if: needs.tag.outputs.publishing == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC, for npm provenance and keyless signing
      packages: write # push the server image to GHCR
    env:
      RELEASE: ${{ needs.tag.outputs.release }}
      VERSION: ${{ needs.tag.outputs.version }}
      CHECKED: ${{ needs.check.outputs.checked }}
      CHECKED_SBOM: ${{ needs.check.outputs.sbom }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - id: report
        uses: actions/download-artifact@v4
        with:
          name: release-report
          path: release-report
      - id: tarballs
        uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs
      - id: sbom
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: .

      # Every file just downloaded is, byte for byte, one `check` pinned, and
      # the report is this run's, green and whole; or nothing is signed.
      - name: What was downloaded is what check checked
        id: downloads-checked
        run: |
          node scripts/release-report/verify-publish.mjs --stage downloads \
            --report release-report/release-report.json \
            --tarballs release-tarballs \
            --notes release-report/RELEASE_NOTES.md \
            --sbom "formancy-data-${RELEASE}-sbom.cdx.json" \
            --release "${RELEASE}" \
            --version "${VERSION}"

      - id: cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's OIDC identity rather
      # than to a private key somebody has to keep.
      - name: Sign the SBOM
        id: sign-sbom
        run: |
          cosign sign-blob --yes \
            --bundle "formancy-data-${RELEASE}-sbom.cdx.json.sigstore" \
            "formancy-data-${RELEASE}-sbom.cdx.json"

      # The report of the run that gated this release, signed by the same
      # identity, so a customer can check it is the one this workflow made.
      - name: Sign the release report
        id: sign-report
        run: |
          for kind in md json; do
            cp "release-report/release-report.${kind}" "formancy-data-${RELEASE}-release-report.${kind}"
            cosign sign-blob --yes \
              --bundle "formancy-data-${RELEASE}-release-report.${kind}.sigstore" \
              "formancy-data-${RELEASE}-release-report.${kind}"
          done

      # ── The server image ────────────────────────────────────────────────
      #
      # Built here rather than reusing CI's: an image somebody deploys should be
      # produced by the workflow that signs it, at the commit the tag names, and
      # not carried between jobs where the thing signed and the thing built could
      # drift apart. The same steps as formancy.ai's release, with the same pins.
      - id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the registry
        id: registry-login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`, deliberately: an image somebody runs in production should be
      # one they chose by version, and a moving tag is not a version.
      - name: Build and push the server image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/data-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/formancy-data-server:${{ needs.tag.outputs.release }}
          provenance: mode=max

      # By DIGEST, never by tag. A tag is mutable, so signing a tag says nothing
      # about the bytes anybody later pulls under that name.
      - name: Sign the image
        id: sign-image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: cosign sign --yes "ghcr.io/${OWNER}/formancy-data-server@${DIGEST}"

      - name: Attach the SBOM to the image
        id: attest-sbom
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate "formancy-data-${RELEASE}-sbom.cdx.json" \
            "ghcr.io/${OWNER}/formancy-data-server@${DIGEST}"

      - name: Say which image this release is
        id: image-summary
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "ghcr.io/${OWNER}/formancy-data-server:${RELEASE}"
            echo "digest: ${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The tarballs the install gate packed, installed and ran, and `check`
      # held to the report and pinned: npm receives exactly those bytes, with
      # provenance. publish.mjs holds them to the pin again itself.
      - name: Publish to npm with provenance
        id: npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/release-report/publish.mjs --tarballs release-tarballs --report release-report/release-report.json

      # The body is this version's changelog section and the report's summary,
      # built and measured by the report job before anything was published.
      - name: Create the GitHub release
        id: github-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-report/RELEASE_NOTES.md
          files: |
            formancy-data-*-sbom.cdx.json
            formancy-data-*-sbom.cdx.json.sigstore
            formancy-data-*-release-report.md
            formancy-data-*-release-report.md.sigstore
            formancy-data-*-release-report.json
            formancy-data-*-release-report.json.sigstore
          fail_on_unmatched_files: true
